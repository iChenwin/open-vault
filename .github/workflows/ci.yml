name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Static checks
        run: go vet ./...
      - name: Tests, encrypted image recovery and Unix socket integration
        run: go test -race -count=1 -v ./...
      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -o open-vault .
          CGO_ENABLED=0 go build -trimpath -o open-vault-cbt ./cmd/open-vault-cbt
          CGO_ENABLED=0 go build -trimpath -o open-vault-cbt-agent ./cmd/open-vault-cbt-agent
