name: External COW real kernel primitives
on:
  push:
    branches: [feature/linux-cbt]
    paths:
      - 'scripts/blksnap-lab/**'
      - '.github/workflows/blksnap-kernel-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blksnap-ubuntu-24-04-ga-ext4-xfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Prepare file-backed virtual machine tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client
      - name: Test external storage snapshot and CBT primitives in the disposable guest
        env:
          CBT_LAB_PROFILE: blksnap
          CBT_LAB_BUILD: host
          CBT_LAB_ACCEL: tcg
          CBT_LAB_RESULTS: ${{ runner.temp }}/blksnap-kernel-results
        run: bash scripts/cbt-lab/host.sh
      - name: Preserve exact driver and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blksnap-primitives-${{ github.run_id }}
          path: ${{ runner.temp }}/blksnap-kernel-results
          if-no-files-found: warn
          retention-days: 14
